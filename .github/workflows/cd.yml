name: CD Pipeline

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish
        run: dotnet publish MyApp.Api/MyApp.Api.csproj -c Release -o ./publish

      - name: Zip publish output
        run: cd ./publish && zip -r ../deploy.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy via REST API (Kudu zip deploy)
        run: |
          CREDS=$(az webapp deployment list-publishing-credentials \
            --resource-group myapp-rg \
            --name myappcicd \
            --query "{user:publishingUserName, pass:publishingPassword}" \
            --output json)
          USER=$(echo $CREDS | jq -r '.user')
          PASS=$(echo $CREDS | jq -r '.pass')
          curl -X POST \
            "https://myappcicd.scm.azurewebsites.net/api/zipdeploy" \
            --user "$USER:$PASS" \
            --data-binary @deploy.zip \
            --max-time 300 \
            -w "\nHTTP Status: %{http_code}\n"
