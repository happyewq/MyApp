<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyApp — CI/CD Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      color: #e6edf3;
      margin-bottom: 8px;
    }

    h1 span { color: #58a6ff; }

    .subtitle {
      text-align: center;
      color: #8b949e;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }

    .btn {
      display: block;
      margin: 0 auto 40px;
      padding: 12px 32px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: #2ea043; }
    .btn:disabled { background: #444; cursor: not-allowed; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .card .date {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .card .temp {
      font-size: 2.4rem;
      font-weight: bold;
      color: #58a6ff;
      margin-bottom: 4px;
    }

    .card .summary {
      font-size: 0.9rem;
      color: #c9d1d9;
    }

    .status {
      text-align: center;
      color: #8b949e;
      font-size: 0.85rem;
      margin-top: 24px;
    }

    .error { color: #f85149; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>Hello, <span>MyApp</span> 👋</h1>
  <p class="subtitle">即時天氣資料來自 Azure App Service .NET 10 API</p>

  <button class="btn" id="btn" onclick="fetchWeather()">呼叫 API 取得天氣資料</button>

  <div class="grid" id="grid"></div>
  <div class="status" id="status"></div>
  <div class="error" id="error"></div>

  <script>
    const API = 'https://myappcicd-a5a5awhpbzehb9bc.eastasia-01.azurewebsites.net/weatherforecast';

    async function fetchWeather() {
      const btn = document.getElementById('btn');
      const grid = document.getElementById('grid');
      const status = document.getElementById('status');
      const error = document.getElementById('error');

      btn.disabled = true;
      btn.textContent = '載入中...';
      grid.innerHTML = '';
      error.textContent = '';
      status.textContent = '';

      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="date">${item.date}</div>
            <div class="temp">${item.temperatureC}°C</div>
            <div class="summary">${item.summary}</div>
          `;
          grid.appendChild(card);
        });

        status.textContent = `✅ 成功從 Azure API 取得 ${data.length} 筆資料`;
      } catch (e) {
        error.textContent = `❌ API 呼叫失敗：${e.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = '重新呼叫 API';
      }
    }
  </script>
</body>
</html>
